<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aria · 三标签审核</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#243449;font:15px/1.65 system-ui,"Microsoft YaHei",sans-serif}button,select,textarea{font:inherit;color:inherit}button,select{padding:8px 12px;border:1px solid #ccd7e4;border-radius:6px;background:white}button{cursor:pointer}button.active{border-color:#3b6e9f;background:#e7eff9}.primary{background:#284f7b;color:white;border-color:#284f7b}header.top{background:white;border-bottom:1px solid #d9e2ed;padding:15px 24px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:2}.top h1{font-size:21px;margin:0 12px 0 0}.top small{margin-right:auto;color:#64778d}main{max-width:1660px;margin:auto;padding:20px}.nav{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.nav select{min-width:225px}.layout{display:grid;grid-template-columns:minmax(500px,1.15fr) minmax(420px,1fr);gap:20px;align-items:start}.panel{background:white;border:1px solid #dce4ed;border-radius:10px;padding:20px;margin-bottom:18px}h2{font-size:18px;margin:0 0 12px}h3{font-size:16px;margin:0 0 10px}.muted{color:#697a90;font-size:13px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.tabs button{font-size:13px;padding:6px 9px}.tabs .speaker{border-width:2px;border-color:#53799f}.media-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0}video{display:block;width:100%;aspect-ratio:4/3;background:#172335;border-radius:7px}a{color:#165eb3}.question{font-size:18px;font-weight:600;margin:10px 0}.options{padding-left:24px;margin:10px 0}.options li{padding:3px 0}.answer{background:#fff2d8;padding:9px 12px;border-radius:6px}.zh{border-top:1px solid #dce4ed;padding-top:16px;margin-top:18px}.labels{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.judge{border:1px solid #dce4ed;border-radius:8px;padding:12px;text-align:center}.judge strong{display:block;margin-bottom:9px}.judge button{padding:7px 9px;margin:2px}.judge button.active[data-value="pass"]{background:#e1f2e8;color:#246244;border-color:#3c9067}.judge button.active[data-value="fail"]{background:#fbe9e8;color:#963c39;border-color:#bb6f6c}textarea{display:block;width:100%;min-height:90px;margin-top:14px;border:1px solid #cbd6e3;border-radius:7px;padding:11px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);padding:10px 18px;background:#233e5b;color:white;border-radius:6px;display:none;z-index:4}#status{font-size:13px;color:#54728c}.meta{font-size:13px;color:#6a7b90}#restore{display:none}@media(max-width:1050px){.layout{grid-template-columns:1fr}}@media(max-width:550px){main{padding:10px}.panel{padding:15px}.top{padding:12px!important}.labels{gap:6px}.judge{padding:10px 4px}.judge button{font-size:13px;padding:6px}.judge strong{font-size:13px}}
</style></head><body><header class="top"><h1>Aria · 三标签审核</h1><small id="progress"></small><button class="primary" id="export">导出标签 JSONL</button><button id="backup">备份进度</button><button id="restoreBtn">恢复</button><input type="file" id="restore" accept=".json,.jsonl"></header><main>
<nav class="nav"><button id="previous">← 上一题</button><select id="questionSelect"></select><button id="next">下一题 →</button><button id="nextPending">下一道未标完</button><span id="status"></span></nav>
<div class="layout"><div><section class="panel"><h2>原始视频</h2><p class="muted">选择窗口直接看视频。12路为3名参与者的4个时段；窗口内进度相同不代表原录像同时发生。视频需联网，打开页面不自动加载。</p><div id="windows" class="tabs"></div><div class="media-tools"><button id="play" class="primary">播放</button><button id="prevClip">上一片段</button><select id="segments"></select><button id="nextClip">下一片段</button></div><video id="video" controls playsinline preload="none"></video><p id="clock" class="muted"></p><p><a id="source" target="_blank" rel="noopener noreferrer">打开原始30秒片段</a> <span id="videoStatus" class="muted"></span></p></section></div>
<aside><section class="panel"><h2 id="title"></h2><div id="meta" class="meta"></div><p id="questionEn" class="question"></p><ol id="optionsEn" class="options" type="A"></ol><p id="answerEn" class="answer"></p><div class="zh"><h3>中文题面与选项</h3><p id="questionZh" class="question"></p><ol id="optionsZh" class="options" type="A"></ol><p id="answerZh" class="answer"></p><p class="muted">中文辅助理解，有歧义时以英文为准。声明答案是待核验主张。</p></div></section>
<section class="panel"><h2>仅填写三个标签，备注选填</h2><div class="labels"><div class="judge"><strong>F · 题面形式</strong><button data-label="F" data-value="pass">通过</button><button data-label="F" data-value="fail">不通过</button></div><div class="judge"><strong>E · 证据支持</strong><button data-label="E" data-value="pass">通过</button><button data-label="E" data-value="fail">不通过</button></div><div class="judge"><strong>C · 联合可答</strong><button data-label="C" data-value="pass">通过</button><button data-label="C" data-value="fail">不通过</button></div></div><textarea id="note" aria-label="备注（选填）" placeholder="备注（选填）"></textarea><button id="insertTime" style="margin-top:10px">将当前视频时间插入备注</button><p class="muted">F检查文字形式；E检查题面事实与声明答案；C判断画面是否足够确定所问事实，避免依赖选项排除法。三个标签分别选择，点已选项可取消。</p></section></aside></div></main><div id="toast" class="toast"></div>
<script>
const DATA=__DATA__,$=id=>document.getElementById(id),valid=new Set(DATA.questions.map(q=>q.id));
const key='aria12_independent_human_'+DATA.assignment_id;
function clean(x={}){const label=v=>['pass','fail'].includes(v)?v:'';return {F:label(x.F),E:label(x.E),C:label(x.C??x.C_combined),note:String(x.note??x.notes??'')}}
let state={annotations:{}};try{const saved=JSON.parse(localStorage.getItem(key)||'null');if(saved?.annotations)for(const [id,a] of Object.entries(saved.annotations))if(valid.has(id))state.annotations[id]=clean(a)}catch{}
let current=0,windowId='',segment=0,autoPlay=false;
const row=()=>DATA.questions[current],value=()=>clean(state.annotations[row().id]),fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(Math.floor(s%60)).padStart(2,'0')}`;
function toast(text){$('toast').textContent=text;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2300)}
function persist(){try{localStorage.setItem(key,JSON.stringify(state))}catch{toast('本地保存失败，请导出标签')}}
function complete(a){return ['F','E','C'].every(k=>['pass','fail'].includes(a[k]))}
function progress(){const count=DATA.questions.filter(q=>complete(clean(state.annotations[q.id]))).length;$('progress').textContent=`${count}/${DATA.questions.length}题已标完`;$('status').textContent=complete(value())?'本题三个标签已齐':'本题尚未标齐'}
function drawLabels(){const a=value();document.querySelectorAll('[data-label]').forEach(b=>b.classList.toggle('active',a[b.dataset.label]===b.dataset.value));$('note').value=a.note;progress()}
function saveNote(){const a=value();a.note=$('note').value;state.annotations[row().id]=a;persist()}
function updateClock(){const w=DATA.windows[windowId],s=w.segments[segment],t=$('video').currentTime||0;$('clock').textContent=`${windowId} · 窗口内 ${fmt(segment*30+t)} / 05:00 · 原录像 ${fmt(s.source_start_seconds+t)} · 本片段 ${fmt(t)} / 00:30`}
function loadVideo(play=false){const v=$('video');v.pause();const w=DATA.windows[windowId],s=w.segments[segment];$('windows').innerHTML='';row().windows.forEach(win=>{const b=document.createElement('button');b.textContent=win+' · '+DATA.windows[win].person+(win===row().speaker?'（提问者）':'');b.className=(win===windowId?'active ':'')+(win===row().speaker?'speaker':'');b.onclick=()=>{windowId=win;autoPlay=false;loadVideo()};$('windows').append(b)});$('segments').innerHTML='';w.segments.forEach((c,i)=>$('segments').add(new Option(`${i+1}/10 · 原录像 ${fmt(c.source_start_seconds)}–${fmt(c.source_end_seconds)}`,i)));$('segments').value=segment;v.src=s.url;$('source').href=s.url;$('videoStatus').textContent='';updateClock();if(play)v.play().catch(()=>toast('未能播放，可打开原片段检查网络'))}
function render(){const q=row(),a=value();$('questionSelect').value=current;$('title').textContent=`题 ${current+1} / ${DATA.questions.length}`;$('meta').textContent=`原记录 ${q.seq} · 提问窗口 ${q.speaker}`;$('questionEn').textContent=q.question;$('questionZh').textContent=q.question_zh;for(const [id,options] of [['optionsEn',q.options],['optionsZh',q.options_zh]]){$(id).innerHTML='';options.forEach(o=>{const li=document.createElement('li');li.textContent=o;$(id).append(li)})}$('answerEn').textContent=`声明答案：${q.proposed_option}. ${q.proposed_answer}`;const index='ABCDE'.indexOf(q.proposed_option);$('answerZh').textContent=`声明答案：${q.proposed_option}. ${q.options_zh[index]||q.proposed_answer}`;windowId=q.speaker;segment=0;autoPlay=false;loadVideo();drawLabels()}
function move(delta,pending=false){saveNote();for(let n=1;n<=DATA.questions.length;n++){const i=(current+delta*n+DATA.questions.length)%DATA.questions.length;if(!pending||!complete(clean(state.annotations[DATA.questions[i].id]))){current=i;render();return}}toast('全部题目已标齐')}
function download(name,text,type){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function exportLabels(){saveNote();const result=DATA.questions.map((q,i)=>{const a=clean(state.annotations[q.id]);return {origin:'human_review',candidate_id:q.id,seq:q.seq,display_order:i+1,F:a.F||null,E:a.E||null,C:a.C||null,note:a.note||null}});download(DATA.assignment_id+'_人工三标签.jsonl',result.map(r=>JSON.stringify(r)).join('\n')+'\n','application/x-ndjson')}
async function restore(file){const text=await file.text();let incoming;try{const x=JSON.parse(text);incoming=x.annotations?Object.entries(x.annotations).map(([candidate_id,v])=>({candidate_id,...v})):Array.isArray(x)?x:[x]}catch{incoming=text.split(/\r?\n/).filter(Boolean).map(line=>JSON.parse(line))}for(const r of incoming){if(r.origin&&r.origin!=='human_review')throw Error('仅恢复人工标签或人工备份');if(!valid.has(r.candidate_id))throw Error('题目ID不在当前题库');const a=r.form_values||r;for(const k of ['F','E','C'])if(!['pass','fail','uncertain','',null,undefined].includes(a[k]??(k==='C'?a.C_combined:undefined)))throw Error('标签值应为pass或fail')}for(const r of incoming)state.annotations[r.candidate_id]=clean(r.form_values||r);persist();drawLabels();toast(`已恢复${incoming.length}题`)}
DATA.questions.forEach((q,i)=>$('questionSelect').add(new Option(`题${i+1} · 原记录${q.seq}`,i)));$('questionSelect').onchange=()=>{saveNote();current=Number($('questionSelect').value);render()};$('previous').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('nextPending').onclick=()=>move(1,true);
document.querySelectorAll('[data-label]').forEach(b=>b.onclick=()=>{saveNote();const a=value();a[b.dataset.label]=a[b.dataset.label]===b.dataset.value?'':b.dataset.value;state.annotations[row().id]=a;persist();drawLabels()});$('note').oninput=saveNote;
$('play').onclick=()=>{const v=$('video');if(v.paused){autoPlay=true;v.play().catch(()=>toast('未能播放，可打开原片段检查网络'))}else{autoPlay=false;v.pause()}};$('segments').onchange=()=>{segment=Number($('segments').value);autoPlay=false;loadVideo()};$('prevClip').onclick=()=>{segment=Math.max(0,segment-1);autoPlay=false;loadVideo()};$('nextClip').onclick=()=>{segment=Math.min(9,segment+1);autoPlay=false;loadVideo()};$('video').ontimeupdate=updateClock;$('video').onended=()=>{if(segment<9){segment++;loadVideo(true)}};$('video').onerror=()=>{$('videoStatus').textContent='加载失败，可打开原片段或切换网络重试'};
$('insertTime').onclick=()=>{const a=value(),w=DATA.windows[windowId],t=segment*30+($('video').currentTime||0);a.note+=(a.note?'\n':'')+`${windowId} 原录像${fmt(w.start_seconds+t)}（窗口内${fmt(t)}）`;state.annotations[row().id]=a;persist();drawLabels()};
$('export').onclick=exportLabels;$('backup').onclick=()=>{saveNote();download(DATA.assignment_id+'_进度备份.json',JSON.stringify({origin:'human_review_backup',annotations:state.annotations},null,2),'application/json')};$('restoreBtn').onclick=()=>$('restore').click();$('restore').onchange=async e=>{try{await restore(e.target.files[0])}catch(err){toast(err.message)}e.target.value=''};window.addEventListener('beforeunload',saveNote);render();
</script></body></html>
